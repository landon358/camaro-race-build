<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="0.42" stop-color="#d9dcdf"/>
      <stop offset="0.5" stop-color="#9ea3a8"/>
      <stop offset="0.62" stop-color="#c7cacd"/>
      <stop offset="1" stop-color="#8d9297"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#6f7479"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2464f"/><stop offset="0.5" stop-color="#c8202c"/><stop offset="0.5" stop-color="#a50d18"/><stop offset="1" stop-color="#c41521"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2ee"/><stop offset="0.5" stop-color="#e2e2dc"/><stop offset="0.5" stop-color="#c9c9c3"/><stop offset="1" stop-color="#dcdcd6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d8fe8"/><stop offset="0.5" stop-color="#2f66d6"/><stop offset="0.5" stop-color="#1846b8"/><stop offset="1" stop-color="#2a5ad0"/>
    </linearGradient>
    <clipPath id="inner"><path d="M14 14 H586 V214 L300 278 L14 214 Z"/></clipPath>
  </defs>
  <!-- shield: flat top, straight sides, chevron bottom -->
  <path d="M4 4 H596 V220 L300 286 L4 220 Z" fill="url(#rim)"/>
  <path d="M10 10 H590 V216 L300 280 L10 216 Z" fill="url(#chrome)"/>
  <!-- CAMARO wordmark: wide, square, heavy -->
  <g fill="none" stroke="#1b1b1d" stroke-width="11" stroke-linecap="butt" stroke-linejoin="miter" transform="translate(42 26)">
    <path d="M74 5.5 H5.5 V34.5 H74"/>
    <path d="M90 40 V5.5 H159 V40 M90 23 H159"/>
    <path d="M175 40 V5.5 H261 V40 M218 5.5 V40"/>
    <path d="M277 40 V5.5 H346 V40 M277 23 H346"/>
    <path d="M362 40 V5.5 H431 V23 H362 M398 23 L431 40"/>
    <path d="M447 5.5 H516 V34.5 H447 Z"/>
  </g>
  <!-- three panels, glossy, following the chevron at the bottom -->
  <g clip-path="url(#inner)" stroke="#55595e" stroke-width="2">
    <path d="M112 86 H226 V246 L112 226 Z" fill="url(#red)"/>
    <path d="M243 86 H357 V262 L300 274 L243 262 Z" fill="url(#white)"/>
    <path d="M374 86 H488 V226 L374 246 Z" fill="url(#blue)"/>
  </g>
</svg>
