<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1216" />
    <meta name="description" content="Team Camaro Racing | TPR Racing — 3D parts catalogue for our Gen 6 Camaro road-race car: every part, where it goes, its bolts and torque." />
    <title>Team Camaro Racing | TPR Racing</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preload" href="./data/db.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="./models/body-parts.glb" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="./models/camaro.glb" as="fetch" crossorigin="anonymous" fetchpriority="low" />
    <script type="module" crossorigin src="./assets/index-BTjouGVU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BkzcXFsX.css">
  </head>
  <body>
    <a class="skip-link" href="#browse">Skip to the parts list</a>
    <header class="topbar" id="top">
      <button class="icon-btn only-tablet" id="btn-browse" type="button" aria-label="Show parts list" aria-controls="browse" aria-expanded="false"></button>
      <a class="brand" href="./" aria-label="Team Camaro Racing | TPR Racing — home">
        <img class="brand-badge" src="./brand/camaro-badge-240.png" alt="" width="72" height="35" />
        <span class="brand-text">
          <span class="brand-title">Team Camaro Racing</span>
          <span class="brand-sub">TPR Racing</span>
        </span>
        <img class="brand-chevy" src="./brand/chevy-performance-white-640.png" alt="Chevrolet Performance" width="160" height="17" />
      </a>
      <div class="search-wrap" role="search">
        <label class="sr-only" for="search">Search parts, bolts and part numbers</label>
        <input id="search" type="search" placeholder="Search parts, bolts, part numbers" autocomplete="off" spellcheck="false"
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" />
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
        <div id="search-results" class="search-results" role="listbox" aria-label="Search results" hidden></div>
      </div>
      <nav class="top-actions" aria-label="Tools" id="top-actions"></nav>
    </header>

    <main class="layout" id="layout">
      <nav class="panel left" id="browse" aria-label="Browse parts">
        <div class="tabs" role="tablist" aria-label="Browse by">
          <button class="tab" role="tab" id="tab-btn-systems" aria-controls="tab-systems" aria-selected="true" data-tab="systems">Systems</button>
          <button class="tab" role="tab" id="tab-btn-locations" aria-controls="tab-locations" aria-selected="false" tabindex="-1" data-tab="locations">Locations</button>
          <button class="tab" role="tab" id="tab-btn-phases" aria-controls="tab-phases" aria-selected="false" tabindex="-1" data-tab="phases">Build order</button>
        </div>
        <div class="tab-body" id="tab-systems" role="tabpanel" aria-labelledby="tab-btn-systems"></div>
        <div class="tab-body" id="tab-locations" role="tabpanel" aria-labelledby="tab-btn-locations" hidden></div>
        <div class="tab-body" id="tab-phases" role="tabpanel" aria-labelledby="tab-btn-phases" hidden></div>
        <div class="left-foot" id="left-foot"></div>
      </nav>
      <div class="scrim" id="scrim" hidden></div>

      <section class="viewport" id="viewport" aria-label="3D car">
        <div class="viewbar" id="viewbar" role="toolbar" aria-label="3D view controls"></div>
        <div class="stage" id="stage">
          <canvas id="c" tabindex="-1" aria-label="3D model of the car. Use the parts list to browse the same parts by keyboard."></canvas>
          <div id="labels" class="labels"></div>
          <div id="hover-tip" class="hover-tip" hidden></div>
          <div class="path-chip" id="path-chip" hidden></div>
          <div class="legend" id="legend" hidden></div>
          <div class="gl-fallback" id="gl-fallback" hidden></div>
          <div class="loading" id="loading" role="status">
            <div class="load-bar"><i id="load-bar"></i></div>
            <div id="loading-text">Loading parts…</div>
          </div>
        </div>
      </section>

      <aside class="panel right" id="details" aria-label="Details">
        <div class="sheet-handle" id="sheet-handle" aria-hidden="true"><i></i></div>
        <div id="inspector" class="inspector"></div>
      </aside>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>

    <dialog class="modal" id="modal" aria-labelledby="modal-title">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="modal-title" tabindex="-1"></h2>
          <div class="modal-tools" id="modal-tools"></div>
          <button class="icon-btn" id="modal-close" type="button" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="sr-only" id="sr-live" aria-live="polite"></div>
    <div id="print-root" class="print-root" aria-hidden="true"></div>

  </body>
</html>
